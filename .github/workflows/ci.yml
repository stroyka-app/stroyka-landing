name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Production dependencies only, high and critical only: dev-tool
      # advisories (eslint, browserslist) never reach the site.
      - run: npm audit --omit=dev --audit-level=high

      # Next's build cache holds the Google Fonts files next/font downloads.
      # Without it every run fetches them fresh, and Google occasionally
      # answers with CSS next/font cannot parse ("Cannot read properties of
      # null (reading '1')" in google/loader.js, 2026-10-21). Cached, the
      # fonts are fetched once per lockfile and reused.
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.ts', 'src/**/*.tsx', 'messages/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      # One retry: a cold cache can still meet a bad Google Fonts answer.
      - run: npm run build || (echo "Retrying build once (Google Fonts fetch)" && npm run build)
        env:
          # Dummy values so build doesn't fail on missing env vars
          UPSTASH_REDIS_REST_URL: https://placeholder.upstash.io
          UPSTASH_REDIS_REST_TOKEN: placeholder

      - run: npm run lint
